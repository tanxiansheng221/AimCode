<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THUNDER FIGHTER</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud-top">
      <div id="hud-left">
        <span id="hud-callsign" class="neon">GUEST</span>
        <span id="hud-score">SCORE 0</span>
        <span id="hud-lives">LIVES ♥♥♥</span>
      </div>
      <div id="hud-right">
        <span id="hud-wave">WAVE 1</span>
        <span id="hud-fps"></span>
      </div>
    </header>

    <main id="stage-wrap">
      <canvas id="game-canvas" width="480" height="640"></canvas>

      <div id="overlay-menu" class="overlay visible">
        <h1 class="title glitch">THUNDER<br>FIGHTER</h1>
        <p class="subtitle">a neon arcade shooter</p>
        <div id="auth-panel">
          <input id="in-callsign" type="text" maxlength="20" placeholder="CALLSIGN">
          <input id="in-password" type="password" maxlength="32" placeholder="PASSWORD">
          <div class="btn-row">
            <button id="btn-register" class="neon-btn">REGISTER</button>
            <button id="btn-login" class="neon-btn">LOGIN</button>
          </div>
          <p id="auth-msg" class="msg"></p>
        </div>
        <button id="btn-start" class="neon-btn big" disabled>INSERT COIN</button>
        <p class="hint">ARROWS / WASD move · SPACE shoot · P pause</p>
        <div id="menu-leaderboard"></div>
      </div>

      <div id="overlay-gameover" class="overlay">
        <h1 class="title">GAME OVER</h1>
        <p id="final-score" class="final-score">0</p>
        <p id="highscore-note" class="subtitle"></p>
        <div class="btn-row">
          <button id="btn-retry" class="neon-btn">RETRY</button>
          <button id="btn-menu" class="neon-btn">MENU</button>
        </div>
      </div>

      <div id="overlay-pause" class="overlay">
        <h1 class="title small">PAUSED</h1>
        <p class="hint">press P to resume</p>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/entities.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
